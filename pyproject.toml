[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "customer-segmentation-mlops"
version = "0.1.0"
description = "Customer segmentation and interpretation workflow for ST1511 AI & Machine Learning CA2 Part B."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Goh Kun Ming" }
]
keywords = ["customer-segmentation", "clustering", "machine-learning", "mlops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "joblib>=1.3",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3"
]

[project.urls]
Repository = "https://github.com/fishman7337/sp-daaa-aiml-ca2-customer-clustering-and-interpretation"
Documentation = "https://github.com/fishman7337/sp-daaa-aiml-ca2-customer-clustering-and-interpretation/tree/main/docs"

[project.optional-dependencies]
notebook = [
  "jupyter>=1.0",
  "matplotlib>=3.7",
  "plotly>=5.18",
  "scipy>=1.11",
  "seaborn>=0.13"
]
dev = [
  "bandit[toml]>=1.7.9",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6.0"
]

[project.scripts]
customer-segmentation = "customer_segmentation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_segmentation"]

[tool.pytest.ini_options]
addopts = "-q --cov=customer_segmentation --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks/**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv"]
skips = ["B101"]
